name: Linux Packages

on:
  push:
    tags:
      - 'v*-mirrorphone.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arch
            distro: arch
            container: archlinux:latest
          - name: fedora-44
            distro: fedora
            container: fedora:44
          - name: fedora-45
            distro: fedora
            container: fedora:45
          - name: opensuse-tumbleweed
            distro: opensuse
            container: opensuse/tumbleweed
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} package
        run: bash packaging/linux/build.sh ${{ matrix.distro }} . dist

      - uses: actions/upload-artifact@v4
        with:
          name: kdeconnect-${{ matrix.name }}-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums and release notes
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          {
            echo "Native x86_64 packages for Arch Linux, Fedora and openSUSE Tumbleweed."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > ../notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
